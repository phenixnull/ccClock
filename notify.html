<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Notify</title>
<style>
  :root { {{themeStyles}} }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ttl); outline-offset: 3px; }
  button:disabled { cursor: wait; opacity: .6; }
  .card {
    width: calc(100% - 20px);
    min-height: 140px;
    max-height: var(--card-max-height, 480px);
    margin: 10px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card.entering { animation: slideIn .35s cubic-bezier(.16,1,.3,1); }
  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideOut {
    to { transform: translateX(120%); opacity: 0; }
  }
  .card.dismissing { animation: slideOut .2s ease-in forwards; }
  .card::before {
    content: ""; position: absolute; inset: -1px; border-radius: 14px; z-index: -1; opacity: .6;
    background: linear-gradient(45deg, var(--p1), var(--p2), var(--p1)); background-size: 300% 300%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { background-position: 0% 50%; opacity: .4; }
    50% { background-position: 100% 50%; opacity: .8; }
  }
  .hdr { display: flex; align-items: center; padding: 14px 88px 8px 16px; gap: 10px; flex-shrink: 0; }
  .bell { width: 28px; height: 28px; flex-shrink: 0; animation: ring .6s ease-in-out infinite alternate; }
  .bell path { fill: var(--bellFill); }
  @keyframes ring {
    from { transform: rotate(-12deg); }
    to { transform: rotate(12deg); }
  }
  .ttl { color: var(--ttl); font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { padding: 4px 18px 14px; flex: 1; min-height: 0; overflow-y: auto; }
  .msg { color: #e0e8f0; font-size: 14px; line-height: 1.7; word-break: break-word; white-space: pre-wrap; }
  .icon-btn {
    position: absolute; top: 10px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: 6px; background: rgba(255,255,255,.1);
    color: #c6d2e1; transition: background .15s;
  }
  .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: rgba(255,255,255,.22); color: #fff; }
  .settings-btn { right: 46px; }
  .settings-btn svg { width: 17px; height: 17px; }
  .close-x { right: 12px; font-size: 20px; }
  .close-x:hover { background: rgba(255,80,80,.6); }
  .settings {
    flex-shrink: 1; min-height: 0; overflow-y: auto; margin: 0 14px 8px; padding: 12px;
    background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    color: #e0e8f0;
  }
  .settings h2 { font-size: 12px; font-weight: 600; color: var(--ttl); margin-bottom: 10px; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting-row + .setting-row { border-top: 1px solid rgba(255,255,255,.1); margin-top: 12px; padding-top: 12px; }
  .setting-label { font-size: 13px; line-height: 1.5; }
  .setting-hint { font-size: 11px; color: #aebdce; line-height: 1.6; margin-top: 2px; }
  .switch {
    width: 42px; height: 24px; flex-shrink: 0; position: relative;
    border: 1px solid rgba(255,255,255,.25); border-radius: 12px; background: rgba(255,255,255,.12);
    transition: background .15s;
  }
  .switch::after {
    content: ""; position: absolute; width: 16px; height: 16px; top: 3px; left: 3px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .switch[aria-checked="true"] { background: var(--p1); border-color: var(--p1); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .settings-status { font-size: 11px; line-height: 1.5; color: #b9c9da; }
  .settings-status:not(:empty) { margin-top: 10px; }
  .settings-status.error { color: #ffb4b4; }
  .ftr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px 12px; flex-shrink: 0; }
  .sound-status { display: flex; align-items: center; gap: 6px; color: #b9c9da; font-size: 11px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); animation: blink .5s ease-in-out infinite alternate; }
  @keyframes blink { to { opacity: .3; } }
  .card.muted .dot { background: #90a0b3; animation: none; }
  .card.muted .bell { animation: none; opacity: .65; }
  .btn { background: var(--btn); color: #fff; border: 0; border-radius: 8px; padding: 8px 28px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.2); transition: background .2s, transform .2s; }
  .btn:hover { background: var(--btnH); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
</style>
</head>
<body>
<div class="card muted" id="card">
  <button class="icon-btn settings-btn" id="settings-button" title="设置" aria-label="设置" aria-expanded="false" aria-controls="settings-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <path d="m9.5 3-.5 2-2 1.2-2-.6-2.5 4.3L4 11.4v2.3l-1.5 1.5L5 19.5l2-.6 2 1.2.5 2h5l.5-2 2-1.2 2 .6 2.5-4.3-1.5-1.5v-2.3l1.5-1.5L19 5.6l-2 .6L15 5l-.5-2z"/>
      <circle cx="12" cy="12.5" r="3.2"/>
    </svg>
  </button>
  <button class="icon-btn close-x" id="x" title="关闭通知" aria-label="关闭通知">&times;</button>
  <div class="hdr">
    <svg class="bell" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2C10.343 2 9 3.343 9 5V5.28C6.607 6.248 5 8.618 5 11.5V16L3 18V19H21V18L19 16V11.5C19 8.618 17.393 6.248 15 5.28V5C15 3.343 13.657 2 12 2Z"/>
      <path d="M10 20C10 21.1046 10.8954 22 12 22C13.1046 22 14 21.1046 14 20H10Z"/>
    </svg>
    <span class="ttl" id="t">通知</span>
  </div>
  <div class="body"><p class="msg" id="m">正在加载…</p></div>
  <section class="settings" id="settings-panel" aria-labelledby="settings-title" hidden>
    <h2 id="settings-title">通知设置</h2>
    <div class="setting-row">
      <div>
        <div class="setting-label" id="sound-label">当前卡片声音</div>
        <p class="setting-hint">立即开启或停止这张卡片的蜂鸣</p>
      </div>
      <button class="switch" id="sound-toggle" role="switch" aria-checked="false" aria-labelledby="sound-label" disabled></button>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label" id="default-sound-label">新通知默认声音</div>
        <p class="setting-hint">自动保存，下次启动也会记住</p>
      </div>
      <button class="switch" id="default-sound-toggle" role="switch" aria-checked="true" aria-labelledby="default-sound-label" disabled></button>
    </div>
    <p class="settings-status" id="settings-status" role="status" aria-live="polite"></p>
  </section>
  <div class="ftr">
    <span class="sound-status"><span class="dot" aria-hidden="true"></span><span id="sound-status" aria-live="polite">声音已关闭</span></span>
    <button class="btn" id="b">确认关闭</button>
  </div>
</div>
<script>
  const card = document.getElementById('card');
  const settingsButton = document.getElementById('settings-button');
  const settingsPanel = document.getElementById('settings-panel');
  const soundToggle = document.getElementById('sound-toggle');
  const defaultSoundToggle = document.getElementById('default-sound-toggle');
  const settingsStatus = document.getElementById('settings-status');
  let audioCtx = null;
  let beepInterval = null;
  let isDismissing = false;
  let isForeground = false;
  let hasNotification = false;
  let layoutRevision = 0;
  let soundEnabled = false;
  let defaultSoundEnabled = true;

  function reportHeight() {
    if (hasNotification && !isDismissing) {
      window.ccNotify.reportHeight(Math.ceil(card.getBoundingClientRect().height) + 20, layoutRevision);
    }
  }

  function applyLayout(constraints) {
    layoutRevision = constraints.revision;
    document.documentElement.style.setProperty('--card-max-height', constraints.maxCardHeight + 'px');
  }

  function setSettingsStatus(message, isError = false) {
    settingsStatus.textContent = message;
    settingsStatus.classList.toggle('error', isError);
  }

  function startBeeping() {
    if (beepInterval !== null || isDismissing || !isForeground) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    } catch {
      audioCtx = null;
      soundEnabled = false;
      setSettingsStatus('无法播放声音，请重新打开开关。', true);
      return;
    }
    function beep() {
      if (!audioCtx || audioCtx.state === 'closed' || !soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.value = 1200;
        gain.gain.setValueAtTime(.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.01, audioCtx.currentTime + .12);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + .12);
      } catch {
        // A notification may be closing while a beep is in flight.
      }
    }
    beep();
    beepInterval = setInterval(beep, 600);
  }

  function stopBeeping() {
    if (beepInterval !== null) {
      clearInterval(beepInterval);
      beepInterval = null;
    }
    if (audioCtx) {
      const ctx = audioCtx;
      audioCtx = null;
      ctx.close().catch(() => {});
    }
  }

  function setCurrentSound(enabled) {
    soundEnabled = enabled && !isDismissing;
    if (soundEnabled && isForeground) startBeeping();
    else stopBeeping();
    soundToggle.setAttribute('aria-checked', String(soundEnabled));
    card.classList.toggle('muted', !soundEnabled);
    document.getElementById('sound-status').textContent = soundEnabled ? '声音已开启' : '声音已关闭';
    reportCardState();
  }

  function reportCardState() {
    if (isForeground && !isDismissing) {
      window.ccNotify.reportCardState({
        currentSoundEnabled: soundEnabled,
        settingsOpen: !settingsPanel.hidden,
      });
    }
  }

  function showSettings(open) {
    settingsPanel.hidden = !open;
    settingsButton.setAttribute('aria-expanded', String(open));
    if (open) soundToggle.focus();
    reportCardState();
    reportHeight();
  }

  function updateDefaultSound(enabled) {
    defaultSoundEnabled = enabled;
    defaultSoundToggle.setAttribute('aria-checked', String(enabled));
  }

  function dismiss() {
    if (isDismissing) return;
    isDismissing = true;
    setCurrentSound(false);
    card.classList.add('dismissing');
    window.ccNotify.dismiss();
  }

  window.ccNotify.onShowNotification((data) => {
    stopBeeping();
    document.getElementById('t').textContent = data.title;
    document.getElementById('m').textContent = data.message;
    isDismissing = false;
    isForeground = false;
    hasNotification = true;
    applyLayout(data);
    soundToggle.disabled = false;
    defaultSoundToggle.disabled = false;
    updateDefaultSound(data.defaultSoundEnabled !== false);
    settingsPanel.hidden = data.settingsOpen !== true;
    settingsButton.setAttribute('aria-expanded', String(!settingsPanel.hidden));
    setCurrentSound(data.soundEnabled ?? (data.silent !== true));
    reportHeight();
  });
  window.ccNotify.onSettingsChanged((settings) => {
    updateDefaultSound(settings.soundEnabled);
  });
  window.ccNotify.onLayoutChanged((constraints) => {
    applyLayout(constraints);
    reportHeight();
  });
  window.ccNotify.onNotificationVisibility((state) => {
    isForeground = state.active;
    card.classList.toggle('entering', isForeground);
    if (typeof state.defaultSoundEnabled === 'boolean') updateDefaultSound(state.defaultSoundEnabled);
    setCurrentSound(typeof state.soundEnabled === 'boolean' ? state.soundEnabled : soundEnabled);
  });
  settingsButton.addEventListener('click', () => showSettings(settingsPanel.hidden));
  soundToggle.addEventListener('click', () => setCurrentSound(!soundEnabled));
  defaultSoundToggle.addEventListener('click', async () => {
    const next = !defaultSoundEnabled;
    defaultSoundToggle.disabled = true;
    setSettingsStatus('正在保存…');
    try {
      const result = await window.ccNotify.setDefaultSoundEnabled(next);
      if (!result.success) throw new Error(result.error || '声音设置保存失败，请重试。');
      updateDefaultSound(result.settings.soundEnabled);
      setSettingsStatus(next ? '已保存，新通知默认开启声音。' : '已保存，新通知默认静音。');
    } catch (error) {
      setSettingsStatus(error.message || '声音设置保存失败，请重试。', true);
    } finally {
      defaultSoundToggle.disabled = false;
      reportHeight();
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !settingsPanel.hidden) {
      showSettings(false);
      settingsButton.focus();
    }
  });
  document.addEventListener('click', (event) => {
    if (!settingsPanel.hidden && !settingsPanel.contains(event.target) && !settingsButton.contains(event.target)) {
      showSettings(false);
    }
  });
  document.getElementById('b').addEventListener('click', dismiss);
  document.getElementById('x').addEventListener('click', dismiss);
  window.addEventListener('beforeunload', stopBeeping);
  new ResizeObserver(reportHeight).observe(card);
</script>
</body>
</html>
